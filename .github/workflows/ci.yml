name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.x
          cache: false
      - name: Verify module
        run: go mod verify
      - name: Vet
        run: go vet ./...
      - name: Staticcheck
        run: |
          set -euo pipefail
          go install honnef.co/go/tools/cmd/staticcheck@v0.6.1
          staticcheck ./...
      - name: Formatting
        run: |
          set -euo pipefail
          go install mvdan.cc/gofumpt@v0.9.2
          test -z "$(gofumpt -l .)"

  test:
    name: Test (${{ matrix.os }}, Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        go: [1.24.x, 1.26.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Test
        run: go test -shuffle=on -count=1 ./...
      - name: Build
        run: go build ./...

  race:
    name: Race detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.x
          cache: false
      - run: go test -race -shuffle=on -count=1 ./...

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.x
          cache: false
      - name: Enforce root-package coverage
        run: |
          set -euo pipefail
          go test -coverprofile=coverage.out .
          COVERAGE=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%", "", $3); print $3}')
          awk -v coverage="$COVERAGE" 'BEGIN {if (coverage < 85) exit 1}'

  security:
    name: Security and dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.x
          cache: false
      - name: Vulnerability scan
        run: |
          set -euo pipefail
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...
      - name: Verify zero runtime dependencies
        run: |
          set -euo pipefail
          EXTERNAL=$(go list -m -f '{{if not .Main}}{{.Path}}{{end}}' all | awk 'NF' | wc -l | tr -d ' ')
          test "$EXTERNAL" -eq 0
